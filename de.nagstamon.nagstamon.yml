app-id: de.nagstamon.nagstamon
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: nagstamon
rename-appdata-file: nagstamon.appdata.xml
rename-desktop-file: nagstamon.desktop
rename-icon: nagstamon
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --persist=.nagstamon
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --filesystem=xdg-run/keyring
  - --filesystem=home
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: dbus-run-session
    buildsystem: autotools
    cleanup: ['*']
    sources:
      - type: archive
        url: https://dbus.freedesktop.org/releases/dbus/dbus-1.14.10.tar.xz
        sha256: ba1f21d2bd9d339da2d4aa8780c09df32fea87998b73da24f49ab9df1e36a50f
        x-checker-data:
          type: anitya
          project-id: 5356
          # Newer release lines require migrating the module away from Autotools.
          versions:
            <: '1.15'
          url-template: https://dbus.freedesktop.org/releases/dbus/dbus-$version.tar.xz

  - name: dbus-python
    buildsystem: meson
    config-opts:
      - -Dtests=false
    sources:
      - type: archive
        url: https://dbus.freedesktop.org/releases/dbus-python/dbus_python-1.5.1.tar.gz
        sha256: 57423cf87d09b7d084f420b55b737fe654c33339b06df77945620d97795c6ac4
        x-checker-data:
          type: anitya
          project-id: 402
          url-template: https://dbus.freedesktop.org/releases/dbus-python/dbus_python-$version.tar.gz

  # MIT Kerberos for gssapi Python package
  # Note: Using 1.22 from GitHub mirror (kerberos.org is unreliable, 1.21.3 has build issues)
  # GitHub archives don't include generated configure scripts, so we need to run autoreconf
  - name: mit-krb5
    buildsystem: simple
    subdir: src
    build-commands:
      - autoreconf -i
      - ./configure --prefix=/app --disable-static --without-system-verto --without-libedit
      - make
      - make install
    cleanup:
      - /share/man
      - /share/examples
      - /share/et
      - '*.a'
      - '*.la'
    sources:
      - type: archive
        url: https://github.com/krb5/krb5/archive/refs/tags/krb5-1.22.3-final.tar.gz
        sha256: 4b1d2f8317e17a5848c62a1af460e00cdd6e8ef0fe267f6e6d1a4bc73a0e416d
        x-checker-data:
          type: anitya
          project-id: 13287
          url-template: https://github.com/krb5/krb5/archive/refs/tags/krb5-$version.tar.gz

  # external python modules
  - python-modules.yml

  - name: nagstamon
    buildsystem: simple
    build-commands:
      - python3 setup.py bdist --format tar
      - tar -xvf dist/nagstamon*.tar --strip 2 -C /app
      - install -Dm755 nagstamon.sh /app/bin/nagstamon
      - mkdir -p /app/share/icons/hicolor/scalable/apps/      -
      - install -Dm644 /app/share/pixmaps/nagstamon.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 nagstamon.appdata.xml -t /app/share/metainfo
    sources:
      - type: archive
        url: https://github.com/HenriWahl/Nagstamon/archive/refs/tags/v3.18.2.tar.gz
        sha256: d7daf3680d1ef373dfc116d564fbd7e489aa19d3c767438b23a8d018ac4dde9b
      - type: file
        url: https://raw.githubusercontent.com/HenriWahl/Nagstamon/v3.18.2/Nagstamon/resources/nagstamon.appdata.xml
        sha256: 15340ccbf8217f43e773f62793411114b998850b1eff6954c318255980e52899
      - type: file
        path: nagstamon.sh
